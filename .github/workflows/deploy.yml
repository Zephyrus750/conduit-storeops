# Test on every push and pull request; deploy the worker to staging on push
# to main. Production is a manual run of this workflow with env=production.
#
# Repository secrets needed once:
#   CLOUDFLARE_API_TOKEN   API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Workers overview page
#   TOKEN_SECRET           any long random string (signs access tokens)
#   OWNER_KEY              the owner key itself; the workflow stores only its hash
name: deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      env:
        description: staging or production
        default: staging
        required: true
      set_secrets:
        description: also push TOKEN_SECRET and OWNER_KEY_HASH to the worker
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ github.event.inputs.env || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Deploy first: a secret can only be attached to a worker that exists.
      - name: Deploy
        run: npx wrangler deploy --env "$TARGET"
      # Secrets reach the shell as environment variables, never inlined, so a
      # key containing $ ` " or ! survives intact. hash-secret trims stdin.
      - name: Worker secrets (first run, or when asked)
        if: github.event.inputs.set_secrets == 'true'
        env:
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
        run: |
          [ -n "$OWNER_KEY" ] || { echo "OWNER_KEY repository secret is empty"; exit 1; }
          [ -n "$TOKEN_SECRET" ] || { echo "TOKEN_SECRET repository secret is empty"; exit 1; }
          printf '%s' "$TOKEN_SECRET" | npx wrangler secret put TOKEN_SECRET --env "$TARGET"
          printf '%s' "$OWNER_KEY" | npm run --silent hash-secret | npx wrangler secret put OWNER_KEY_HASH --env "$TARGET"
          echo "owner key length: ${#OWNER_KEY} characters (hash stored, key never printed)"
      - name: Health
        run: |
          sleep 5
          NAME=$([ "$TARGET" = production ] && echo conduit || echo conduit-staging); curl -s "https://$NAME.zephyrus-np750.workers.dev/v1/health"; echo
