# Conduit worker. One worker serves every store; each store has its own
# Durable Object holding the event log and projections. Deploy per environment:
#   npx wrangler deploy --env staging
#   npx wrangler deploy --env production
# Secrets (set once per environment with `wrangler secret put <NAME> --env <env>`):
#   TOKEN_SECRET     random 32+ bytes, base64. Signs access tokens.
#   OWNER_KEY_HASH   output of `npm run hash-secret -- <owner key>`.

name = "conduit"
main = "worker/index.js"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

# Catalogue: Conduit's own CatalogueObject reads the Kmart product sitemaps
# weekly (Mondays 01:00 store time; "Rebuild now" in the owner console).
# Price, was, image and clearance come from the product page through
# Cloudflare Browser Rendering once these are set on the worker:
#   CF_ACCOUNT_ID  (variable)  and  BROWSER_TOKEN  (secret: Browser Rendering › Edit)
# Until the first build lands and those are set, LOOKUP_URL and DETAILS_URL
# (the legacy suite and details workers) answer instead; remove them, and
# the LOOKUP and DETAILS services below, once the catalogue is live.
[vars]
ENVIRONMENT = "dev"
TOKEN_TTL_SECONDS = "43200"
REFRESH_TTL_SECONDS = "2592000"
LOCKOUT_ATTEMPTS = "5"
LOCKOUT_SECONDS = "900"
LOOKUP_URL = "https://shrill-voice-f46f.zephyrus-np750.workers.dev"
# The K2B importer reads the legacy worker (the same suite worker) unless
# LEGACY_URL points elsewhere.
DETAILS_URL = "https://k2b-details.zephyrus-np750.workers.dev"

[durable_objects]
bindings = [
  { name = "STORE", class_name = "StoreObject" },
  { name = "REGISTRY", class_name = "RegistryObject" },
  { name = "CATALOGUE", class_name = "CatalogueObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StoreObject", "RegistryObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CatalogueObject"]

# Archive and files arrive with the D1 nightly and manifests:
#   npx wrangler d1 create conduit-archive-staging
#   npx wrangler r2 bucket create conduit-files-staging
# Published maps live in each store object (SQLite) and the catalogue uses
# the edge Cache API, so neither needs a KV namespace.
# Service bindings to the other workers on the account. A Worker may not
# fetch another Worker's workers.dev URL on the same account (Cloudflare
# error 1042), so the catalogue proxy and the K2B importer call these
# bindings; the *_URL vars above stay as the URL each binding is called with.
[env.staging]
name = "conduit-staging"
services = [
  { binding = "LOOKUP", service = "shrill-voice-f46f" },
  { binding = "LEGACY", service = "shrill-voice-f46f" },
  { binding = "DETAILS", service = "k2b-details" }
]
vars = { ENVIRONMENT = "staging", TOKEN_TTL_SECONDS = "43200", REFRESH_TTL_SECONDS = "2592000", LOCKOUT_ATTEMPTS = "5", LOCKOUT_SECONDS = "900", LOOKUP_URL = "https://shrill-voice-f46f.zephyrus-np750.workers.dev", DETAILS_URL = "https://k2b-details.zephyrus-np750.workers.dev" }
durable_objects.bindings = [
  { name = "STORE", class_name = "StoreObject" },
  { name = "REGISTRY", class_name = "RegistryObject" },
  { name = "CATALOGUE", class_name = "CatalogueObject" }
]

[env.production]
name = "conduit"
services = [
  { binding = "LOOKUP", service = "shrill-voice-f46f" },
  { binding = "LEGACY", service = "shrill-voice-f46f" },
  { binding = "DETAILS", service = "k2b-details" }
]
vars = { ENVIRONMENT = "production", TOKEN_TTL_SECONDS = "43200", REFRESH_TTL_SECONDS = "2592000", LOCKOUT_ATTEMPTS = "5", LOCKOUT_SECONDS = "900", LOOKUP_URL = "https://shrill-voice-f46f.zephyrus-np750.workers.dev", DETAILS_URL = "https://k2b-details.zephyrus-np750.workers.dev" }
durable_objects.bindings = [
  { name = "STORE", class_name = "StoreObject" },
  { name = "REGISTRY", class_name = "RegistryObject" },
  { name = "CATALOGUE", class_name = "CatalogueObject" }
]
