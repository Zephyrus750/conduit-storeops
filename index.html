<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conduit</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Conduit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="styles/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/shell.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div class="frame">
  <div class="app ws-floor" id="app">
    <aside class="rail">
      <div class="brand">
        <svg class="vmark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#111827"/><path d="M21.94 21.94A8.4 8.4 0 0 1 10.94 22.71" fill="none" stroke="#7DD3FC" stroke-width="5.4"/><path d="M9.66 21.51A8.4 8.4 0 0 1 9.66 10.49" fill="none" stroke="#22A6D6" stroke-width="5.4"/><path d="M10.94 9.29A8.4 8.4 0 0 1 21.94 10.06" fill="none" stroke="#0E7CA8" stroke-width="5.4"/></svg>
        <span class="bname">Conduit</span>
        <button class="bsearch" data-t title="Search (Ctrl K)"><svg class="i"><use href="icons.svg#i-search"/></svg></button><input class="bsin" data-t placeholder="Search anything…" aria-label="Search">
      </div>
      <div class="radm" id="radm"></div>
      <div class="storechip" data-t role="button" tabindex="0" title="This store and device" aria-label="This store and device">
        <svg class="i sc-ic"><use href="icons.svg#i-m-store"/></svg>
        <span class="sc-t"><b id="chipName" data-t>Store</b><span id="chipNo"></span></span>
        <svg class="i"><use href="icons.svg#i-chev"/></svg>
      </div>
      <button class="rrow on" data-view="dashboard"><svg class="i"><use href="icons.svg#i-grid"/></svg><span class="rl" data-t>Dashboard</span></button>
      <div class="railscroll" id="railscroll"></div>
      <div class="railfoot">
        <button class="rrow" data-view="planner"><svg class="i"><use href="icons.svg#i-m-planner"/></svg><span class="rl" data-t>Planner</span></button>
        <button class="rrow" data-view="settings"><svg class="i"><use href="icons.svg#i-m-settings"/></svg><span class="rl" data-t>Settings</span></button>
      </div>
    </aside>
    <div class="m-appbar">
      <div class="search msearch" id="msearch"><svg class="i"><use href="icons.svg#i-search"/></svg><input data-t placeholder="Search" aria-label="Search" autocomplete="off"><button class="voicebtn" type="button" data-voice data-t hidden aria-label="Search by voice" title="Search by voice"><svg class="i"><use href="icons.svg#i-mic"/></svg></button></div>
      <button class="msync" id="msync" type="button" data-shell-act="sync" hidden></button>
      <button class="mdepts" data-t title="Departments" aria-label="Departments"><svg class="i"><use href="icons.svg#i-grid"/></svg></button>
    </div>
    <div class="main">
      <header class="top">
        <span id="crumb" hidden></span>
        <div id="hdrslot"></div>
        <div class="search" id="hsearch"><svg class="i"><use href="icons.svg#i-search"/></svg><input data-t placeholder="Search anything — a shelf, bay, product, manifest or consolidation…" aria-label="Search" readonly><span class="kbd">Ctrl K</span><button class="voicebtn" type="button" data-voice data-t hidden aria-label="Search by voice" title="Search by voice"><svg class="i"><use href="icons.svg#i-mic"/></svg></button></div>
        <button class="btn accent showmap" id="showMap" data-go="map"><svg class="i"><use href="icons.svg#i-map"/></svg><span data-t>Show map</span></button>
      </header>
      <div class="teambar" id="teambar" hidden></div>
      <main class="content" id="content"></main>
      <footer class="foot">
        <button class="fmenu" id="railToggle" data-t title="Collapse the rail to icons"><svg class="i"><use href="icons.svg#i-sidebar"/></svg><span data-t>Menu</span></button><span class="fdiv"></span>
        <span id="footDate"></span>
        <span class="fsp"></span>
        <span id="footSync" data-t><span class="dot off"></span>Offline</span><span class="fdiv"></span><span class="ver" id="footVer"></span>
      </footer>
    </div>
    <nav class="m-tabs" id="mstrip"></nav>
  </div>
  <!-- The boot screen, from the first paint until the app shows its first
       screen (the sign-in, Continue or the store loading), so the empty
       signed-in frame never shows while the scripts load. -->
  <div id="cover" class="signin loading boot"><div class="ld-center"><div class="ld-brand"><svg class="vmark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#111827"/><path d="M21.94 21.94A8.4 8.4 0 0 1 10.94 22.71" fill="none" stroke="#7DD3FC" stroke-width="5.4"/><path d="M9.66 21.51A8.4 8.4 0 0 1 9.66 10.49" fill="none" stroke="#22A6D6" stroke-width="5.4"/><path d="M10.94 9.29A8.4 8.4 0 0 1 21.94 10.06" fill="none" stroke="#0E7CA8" stroke-width="5.4"/></svg><span class="ld-word">Con<b>duit</b></span></div><div class="ld-bar"><i></i></div></div></div>
</div>
<script type="module" src="js/shell.js"></script>
</body>
</html>
